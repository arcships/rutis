\* Route B (scoped taint-on-timeout) in Node native Cordis mode (Promise.all)
\* across two scoped instances sharing bare row name "w" in scopes "s1" and "s2".
\* Expected: ok.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1", "s2"}
    Services = {"forecast"}
    MaxGen = 2
    MaxEpoch = 2
    Policy = "taint"
    Mode = "cordis"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoOrphanWithdrawal
    SerialCleanupsWithinGen
    ServiceOwnerValid
    ActiveServiceIntact
    NoSpuriousRowFailure
    NoCrossGenCorruption
    HealthyInstanceNotBlocked
    NoConcurrentSameRowInSharedProcess
CHECK_DEADLOCK FALSE

\* Route B (taint-on-timeout) in Node native Cordis mode (Promise.all).
\* Expected: ok.
CONSTANTS
    Rows = {"w", "m"}
    MaxGen = 2
    MaxEpoch = 2
    Policy = "taint"
    Mode = "cordis"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoOrphanWithdrawal
    SerialCleanupsWithinGen
    NoCrossGenCorruption
    NoConcurrentSameRowInSharedProcess
CHECK_DEADLOCK FALSE

\* Mutation: LateWithdraw omits the registration-identity check and deletes from
\* svcTable by service name alone, wiping a healthy sibling's active service.
\* Expected: violated:ActiveServiceIntact.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1", "s2"}
    Services = {"forecast"}
    MaxGen = 1
    MaxEpoch = 1
    Policy = "taint"
    Mode = "leaf"
    Mutation = "withdrawByNameOnly"
SPECIFICATION Spec
INVARIANTS
    ActiveServiceIntact
CHECK_DEADLOCK FALSE

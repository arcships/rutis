\* Mutation: skip remaining framework withdrawals when a user cleanup times out.
\* Expected: violated:NoOrphanWithdrawal.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1"}
    Services = {"forecast"}
    MaxGen = 1
    MaxEpoch = 1
    Policy = "taint"
    Mode = "leaf"
    Mutation = "skipWithdraw"
SPECIFICATION Spec
INVARIANTS
    NoOrphanWithdrawal
CHECK_DEADLOCK FALSE

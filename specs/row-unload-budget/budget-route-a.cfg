\* Route A (allow in-place reload after timeout in the same shared runtime):
\* proves that silent in-place reload violates NoConcurrentSameRowInSharedProcess.
\* Expected: violated:NoConcurrentSameRowInSharedProcess.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1", "s2"}
    Services = {"forecast"}
    MaxGen = 2
    MaxEpoch = 1
    Policy = "allowReload"
    Mode = "leaf"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    NoConcurrentSameRowInSharedProcess
CHECK_DEADLOCK FALSE

\* Mutation: LateProvide omits the active-row / draining guard and writes into
\* the shared svcTable from a lingering old-generation cleanup.
\* Expected: violated:ServiceOwnerValid.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1", "s2"}
    Services = {"forecast"}
    MaxGen = 1
    MaxEpoch = 1
    Policy = "taint"
    Mode = "leaf"
    Mutation = "missingActiveGuard"
SPECIFICATION Spec
INVARIANTS
    ServiceOwnerValid
CHECK_DEADLOCK FALSE

\* Route B (taint-on-timeout) in leaf sequential mode across two rows sharing
\* one runtime process, up to 2 generations and 1 runtime restart. Expected: ok.
CONSTANTS
    Rows = {"w", "m"}
    MaxGen = 2
    MaxEpoch = 2
    Policy = "taint"
    Mode = "leaf"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoOrphanWithdrawal
    SerialCleanupsWithinGen
    NoCrossGenCorruption
    NoConcurrentSameRowInSharedProcess
CHECK_DEADLOCK FALSE

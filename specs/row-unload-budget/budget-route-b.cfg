\* Route B (scoped taint-on-timeout) in leaf sequential mode across two scoped
\* instances sharing bare row name "w" in scopes "s1" and "s2", sharing service
\* "forecast", up to 2 generations and 1 runtime restart. Expected: ok.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1", "s2"}
    Services = {"forecast"}
    MaxGen = 2
    MaxEpoch = 2
    Policy = "taint"
    Mode = "leaf"
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoOrphanWithdrawal
    SerialCleanupsWithinGen
    ServiceOwnerValid
    ActiveServiceIntact
    NoSpuriousRowFailure
    NoCrossGenCorruption
    HealthyInstanceNotBlocked
    NoConcurrentSameRowInSharedProcess
CHECK_DEADLOCK FALSE

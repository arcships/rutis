\* Mutation: tainting keys by bare rowName regardless of scope, blocking a
\* healthy instance sharing the same row name in another scope.
\* Expected: violated:HealthyInstanceNotBlocked.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1", "s2"}
    Services = {"forecast"}
    MaxGen = 1
    MaxEpoch = 1
    Policy = "taint"
    Mode = "leaf"
    Mutation = "taintByBareName"
SPECIFICATION Spec
INVARIANTS
    HealthyInstanceNotBlocked
CHECK_DEADLOCK FALSE

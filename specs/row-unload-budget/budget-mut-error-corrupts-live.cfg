\* Mutation: LateUnhandledError omits rejection absorption / active-origin guard
\* and marks a live row "failed" in rowStatus.
\* Expected: violated:NoSpuriousRowFailure.
CONSTANTS
    RowNames = {"w"}
    Scopes = {"s1", "s2"}
    Services = {"forecast"}
    MaxGen = 1
    MaxEpoch = 1
    Policy = "taint"
    Mode = "leaf"
    Mutation = "errorCorruptsLive"
SPECIFICATION Spec
INVARIANTS
    NoSpuriousRowFailure
CHECK_DEADLOCK FALSE

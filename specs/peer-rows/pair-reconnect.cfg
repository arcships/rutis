\* The connection breaks once and comes back: both rows stop, the old rows
\* are cleaned, both hellos are answered and both rows run again. Expected:
\* ok (safety only).
CONSTANTS
    MaxRounds = 2
    Faults = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    CleanedBeforeAnswer
    RowsStopOnBreak
    NoWaitingForOut
CHECK_DEADLOCK FALSE

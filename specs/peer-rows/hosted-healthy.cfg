\* A host describes, loads, updates and unloads one row for a far end; the
\* far end cancels a load in flight and unloads. No orphan, exact describe,
\* loads only what describe found.
\* Expected: ok.
CONSTANTS
    Keys = {"a"}
    Catalog = {"a"}
    MaxLoads = 2
    MaxUpdates = 2
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    NoOrphan
    UpdatingLoadedOnly
    DescribeExact
    LoadOnlyDescribed
CHECK_DEADLOCK FALSE

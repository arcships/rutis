\* An unload arrives before its load: the host has no tombstone, forgets it,
\* and the load that follows inserts the row. Expected: violated:NoOrphan.
CONSTANTS
    Keys = {"a"}
    Catalog = {"a"}
    MaxLoads = 2
    MaxUpdates = 2
    Mutation = "noTombstone"
SPECIFICATION Spec
INVARIANTS
    NoOrphan
CHECK_DEADLOCK FALSE

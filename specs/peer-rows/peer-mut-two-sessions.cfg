\* The host answers the new session's hello before the old session's rows
\* are cleaned, so both sessions load the same instance.
\* Expected: violated:OneInstanceAtATime.
CONSTANTS
    Rows = {"a", "b"}
    MaxSessions = 2
    MaxGens = 2
    Faults = {"lose"}
    Failures = FALSE
    SelfEnds = TRUE
    Mutation = "acceptBeforeClean"
SPECIFICATION Spec
INVARIANTS
    OneInstanceAtATime
CHECK_DEADLOCK FALSE

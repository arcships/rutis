\* Two nodes host a row for each other, both cold at once; both answer
\* without waiting for their own row, both rows run. Expected: ok.
CONSTANTS
    MaxRounds = 1
    Faults = FALSE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    CleanedBeforeAnswer
    RowsStopOnBreak
    NoWaitingForOut
PROPERTY EventuallyBothLoaded
CHECK_DEADLOCK FALSE

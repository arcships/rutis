\* The link may go down and up; the row waits while it is down and starts
\* again on the snapshot the far end sends when it comes back. Expected: ok
\* (safety only: with the link allowed to go down again, liveness is not
\* asserted).
CONSTANTS
    MaxRegs = 1
    MaxBreaks = 1
    MaxWithdrawals = 1
    Withdrawals = FALSE
    Faults = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    EpochWithFamily
    GatedStart
    WithdrawalStops
    NoFailedRow
    OfflineWaits
CHECK_DEADLOCK FALSE

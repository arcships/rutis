\* An ending or failure the old session had not delivered yet arrives
\* after the row moved to the next session: the peer acts on it by key,
\* not by the generation it belongs to. Expected: violated:OwnGenerationOnly.
CONSTANTS
    Rows = {"a", "b"}
    MaxSessions = 2
    MaxGens = 2
    Faults = {"lose"}
    Failures = TRUE
    SelfEnds = TRUE
    Mutation = "lateEnding"
SPECIFICATION Spec
INVARIANTS
    OwnGenerationOnly
CHECK_DEADLOCK FALSE

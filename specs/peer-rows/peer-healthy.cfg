\* Two rows, two sessions, the old one may break; a row may end on its
\* own; no failures. Expected: ok (all safety invariants).
CONSTANTS
    Rows = {"a", "b"}
    MaxSessions = 2
    MaxGens = 2
    Faults = {"lose"}
    Failures = FALSE
    SelfEnds = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneInstanceAtATime
    OwnGenerationOnly
    ServicesFollowRows
    CleanupOnce
CHECK_DEADLOCK FALSE

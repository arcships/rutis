\* A registration is announced twice: first with the family but no `since`
\* (epoch 0), then with the real one. One registration, two offers.
\* Expected: violated:EpochWithFamily.
CONSTANTS
    MaxRegs = 2
    MaxBreaks = 0
    MaxWithdrawals = 0
    Withdrawals = FALSE
    Faults = FALSE
    Mutation = "twoOffers"
SPECIFICATION Spec
INVARIANTS
    EpochWithFamily
CHECK_DEADLOCK FALSE

\* The host ends the session but keeps the rows it had loaded.
\* Expected: violated:liveness (EndedRowsCleaned).
CONSTANTS
    Rows = {"a", "b"}
    MaxSessions = 2
    MaxGens = 2
    Faults = {"lose"}
    Failures = FALSE
    SelfEnds = TRUE
    Mutation = "keepRows"
SPECIFICATION Spec
PROPERTY EndedRowsCleaned
CHECK_DEADLOCK FALSE

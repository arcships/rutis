\* The far end cancels a load in flight without sending `rows.unload` (no
\* disposer was registered): the host applies the row and is left with an
\* orphan. Expected: violated:NoOrphan.
CONSTANTS
    Keys = {"a"}
    Catalog = {"a"}
    MaxLoads = 2
    MaxUpdates = 2
    Mutation = "cancelNoUnload"
SPECIFICATION Spec
INVARIANTS
    NoOrphan
CHECK_DEADLOCK FALSE

\* One controller; the listening runtime is an app hosting its plugins: it
\* stops once (closing the current session and the connections accepted but
\* not served, cleaning the lease, accepting no dial), then starts again in
\* a new round; the stop of the last round is final. A start while the stop
\* is still cleaning up runs once it is done; nothing from the old round is
\* served in the new one. Expected: ok. `RestartRecovers` asks for the
\* lease after a stop whose round has a successor, while the controller
\* still has a connection to spend.
CONSTANTS
    Controllers = {c1}
    MaxConns = 3
    MaxLoads = 1
    MaxFaults = 2
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 2
    MaxStops = 1
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    RuntimeStopped
    RestartIsFresh
    FinalStopStaysDown
PROPERTIES
    RestartRecovers
CHECK_DEADLOCK FALSE

\* One controller; the listening runtime is an app hosting its plugins: it
\* stops once (closing the current session and the connections accepted but
\* not served, cleaning the lease, accepting no dial), then starts again in
\* a new round. A start while the stop is still cleaning up runs once it is
\* done; nothing from the old round is served in the new one. Expected: ok.
CONSTANTS
    Controllers = {c1}
    MaxConns = 4
    MaxLoads = 1
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 2
    Healthy = TRUE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    RuntimeStopped
    RestartIsFresh
CHECK_DEADLOCK FALSE

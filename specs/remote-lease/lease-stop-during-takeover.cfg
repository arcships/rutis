\* Two controllers; the app stops while a takeover is under way (closing
\* the old session and the connection the takeover was for, cleaning the
\* lease), then starts in a new round. Nothing of the takeover is served in
\* the new round; the old lease is gone before any new hello. Expected: ok.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 0
    LinkStops = FALSE
    Cleanup = "deadline"
    Auth = "step"
    MaxRounds = 2
    MaxStops = 2
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    CleanBeforeHello
    RuntimeStopped
    RestartIsFresh
    FinalStopStaysDown
CHECK_DEADLOCK FALSE

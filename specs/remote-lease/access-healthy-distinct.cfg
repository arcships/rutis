\* Two far ends with ids of their own, each paying for up to 4 connections;
\* nothing lost or stopped. Expected: ok, liveness included.
CONSTANTS
    Dialers = {d1, d2}
    SameId = FALSE
    MaxConns = 4
    MaxFaults = 0
    Faults = {}
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedRoundsStayDown
    RestartIsFresh
    FinalStopStaysDown
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE

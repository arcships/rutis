\* Liveness after faults: two far ends with ids of their own, each paying
\* for 2 connections in its round, at most 2 transient faults in the run,
\* no stop. A redial replacing a connection a fault lost is free, so once
\* the faults are spent the last connection stays. EndsHeld is checked
\* without symmetry. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = FALSE
    MaxConns = 2
    MaxFaults = 2
    Faults = {"lose"}
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE

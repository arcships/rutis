\* Mutation: stopping the runtime leaves the connections it accepted but had
\* not served yet; after the start they are served in the new round (the
\* superseded run serves the latest round). Expected: violated:RestartIsFresh.
CONSTANTS
    Controllers = {c1}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 0
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 2
    MaxStops = 1
    Mutation = "staleRound"
SPECIFICATION Spec
INVARIANTS
    RestartIsFresh
CHECK_DEADLOCK FALSE

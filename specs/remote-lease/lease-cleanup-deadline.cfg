\* One controller, up to 2 dials (1 takeover). The old lease's cleanup has a
\* deadline: it starts, then either finishes or is killed when the deadline
\* passes (at most one kill). The killed session's lease goes with it:
\* OneLease and OldCommandsStayOld still hold, and the new hello is
\* answered only once the old lease is gone. Expected: ok.
CONSTANTS
    Controllers = {c1}
    MaxConns = 2
    MaxLoads = 1
    Cleanup = "deadline"
    Auth = "upgrade"
    MaxRounds = 1
    Healthy = FALSE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    CleanBeforeHello
CHECK_DEADLOCK FALSE

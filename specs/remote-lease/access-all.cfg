\* Same id, up to 2 paid connections each, 1 transient fault, one dialer
\* stopped for good. Expected: ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 2
    MaxFaults = 1
    Faults = {"lose", "stop"}
    MaxRounds = 1
    MaxStops = 1
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedRoundsStayDown
    RestartIsFresh
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

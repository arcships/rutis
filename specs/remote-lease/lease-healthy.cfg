\* Two controllers, each paying for up to 4 connections (3 reconnects);
\* no transient fault and no stop. Expected: ok, liveness included.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 4
    MaxLoads = 1
    MaxFaults = 0
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    StoppedStaysDown
    ReadyIsCurrent
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE

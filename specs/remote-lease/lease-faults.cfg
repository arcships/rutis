\* Two controllers, each paying for up to 3 connections (2 reconnects);
\* up to 3 transient faults (failed dials, lost connections) in the run,
\* and links may be disposed. Expected: ok.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 3
    MaxLoads = 1
    MaxFaults = 3
    LinkStops = TRUE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    StoppedStaysDown
    ReadyIsCurrent
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

\* Mutation: a greeting that arrives after the link gave up on the
\* handshake makes it ready. Expected: violated:ReadyIsCurrent.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 1
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "lateHello"
SPECIFICATION Spec
INVARIANTS
    ReadyIsCurrent
CHECK_DEADLOCK FALSE

\* Mutation: revoking an id also drops the listen row's registration, so
\* later dials are refused at the upgrade and never reach the link.
\* Expected: violated:StaysRegistered.
CONSTANTS
    Dialers = {d1}
    SameId = FALSE
    MaxConns = 2
    MaxFaults = 0
    Faults = {"revoke"}
    MaxRounds = 1
    MaxStops = 0
    Mutation = "revokeUnregisters"
SPECIFICATION Spec
INVARIANTS
    StaysRegistered
CHECK_DEADLOCK FALSE

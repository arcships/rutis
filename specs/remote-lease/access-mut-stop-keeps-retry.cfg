\* Mutation: stopping a far end that waits to redial leaves the redial
\* pending. Expected: violated:StoppedRoundsStayDown.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxFaults = 0
    Faults = {"stop"}
    MaxRounds = 1
    MaxStops = 1
    Mutation = "stopKeepsRetry"
SPECIFICATION Spec
INVARIANTS
    StoppedRoundsStayDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

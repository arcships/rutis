\* Liveness after faults: two controllers, each paying for 2 connections,
\* at most 2 transient faults in the run, no stop. A redial replacing a
\* connection a fault lost is free, so once the faults are spent the last
\* connection stays. EndsHeld is checked without symmetry (TLC may miss a
\* liveness violation with symmetry). Expected: ok.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 2
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE

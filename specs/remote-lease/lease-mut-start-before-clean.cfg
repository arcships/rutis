\* Mutation: the new session answers its hello before the old lease is
\* cleaned. Expected: violated:OneLease.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 1
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "startBeforeClean"
SPECIFICATION Spec
INVARIANTS
    OneLease
CHECK_DEADLOCK FALSE

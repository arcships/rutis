\* Mutation: a revocation is only seen if it was known when the handshake
\* completed (the snapshot checked at Join); one arriving while the
\* connection waits to be taken over is missed and it installs (the old
\* behaviour of DIA-5-10). Expected: violated:RevokedStaysOut.
CONSTANTS
    Dialers = {d1}
    SameId = FALSE
    MaxConns = 2
    MaxFaults = 0
    Faults = {"revoke"}
    MaxRounds = 1
    MaxStops = 0
    Mutation = "revokeAfterHandshake"
SPECIFICATION Spec
INVARIANTS
    RevokedStaysOut
CHECK_DEADLOCK FALSE

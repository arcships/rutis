\* Mutation: a connection's heartbeat starts when it is accepted, not when
\* its hello is answered; while the old lease is cleaned the waiting
\* connection is closed with 1001 (Kotlin, #615). Expected:
\* violated:NoHeartbeatBeforeHello.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 0
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "step"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "heartbeatFromAccept"
SPECIFICATION Spec
INVARIANTS
    NoHeartbeatBeforeHello
CHECK_DEADLOCK FALSE

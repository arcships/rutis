\* Mutation: the dialer matches a handshake result by connection number
\* alone, not by round: a late hello of the previous round's connection 1
\* makes the new round's connection 1 `ready` before it greeted.
\* Expected: violated:RestartIsFresh.
CONSTANTS
    Dialers = {d1}
    SameId = FALSE
    MaxConns = 2
    MaxFaults = 0
    Faults = {"stop"}
    MaxRounds = 2
    MaxStops = 1
    Mutation = "matchByNumber"
SPECIFICATION Spec
INVARIANTS
    RestartIsFresh
CHECK_DEADLOCK FALSE

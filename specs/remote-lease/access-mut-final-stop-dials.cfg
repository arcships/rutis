\* Mutation: a start after the stop of the last round opens one more round
\* and the app dials again. Expected: violated:FinalStopStaysDown.
CONSTANTS
    Dialers = {d1}
    SameId = FALSE
    MaxConns = 2
    MaxFaults = 0
    Faults = {"stop"}
    MaxRounds = 2
    MaxStops = 2
    Mutation = "finalStopDials"
SPECIFICATION Spec
INVARIANTS
    FinalStopStaysDown
CHECK_DEADLOCK FALSE

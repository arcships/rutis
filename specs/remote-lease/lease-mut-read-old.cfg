\* Mutation: the runtime still reads a replaced session and applies its
\* commands to the rows it serves now. Expected: violated:OldCommandsStayOld.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 1
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "readOld"
SPECIFICATION Spec
INVARIANTS
    OldCommandsStayOld
CHECK_DEADLOCK FALSE

\* One controller, up to 3 connections (2 takeovers); it loses a session
\* and redials while the runtime still serves the old one. The runtime
\* authenticates the new connection (Auth = "step") before it closes the
\* old session, cleans the old lease, and only then answers the new hello
\* (§4.4); two transient faults in all. Expected: ok.
CONSTANTS
    Controllers = {c1}
    MaxConns = 3
    MaxLoads = 1
    MaxFaults = 2
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "step"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    ReadyIsCurrent
CHECK_DEADLOCK FALSE

\* Two far ends greeting with the same id, each paying for up to 4
\* connections (3 reconnects); nothing lost or stopped. They replace each
\* other until one runs out of connections. Expected: ok, liveness included.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 4
    MaxFaults = 0
    Faults = {}
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedRoundsStayDown
    RestartIsFresh
    FinalStopStaysDown
PROPERTIES
    EventuallyHeld
    EndsHeld
CHECK_DEADLOCK FALSE

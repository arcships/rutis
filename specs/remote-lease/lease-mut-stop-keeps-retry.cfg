\* Mutation: stopping a link that waits to retry leaves the retry
\* pending. Expected: violated:StoppedStaysDown.
CONSTANTS
    Controllers = {c1, c2}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 1
    LinkStops = TRUE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 1
    MaxStops = 0
    Mutation = "stopKeepsRetry"
SPECIFICATION Spec
INVARIANTS
    StoppedStaysDown
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

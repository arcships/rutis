\* Same id, each dialer paying for up to 3 connections in its round and up
\* to 2 transient faults in the run (failed dials and handshakes, lost
\* connections, sessions ending); a redial after a loss is free. Expected:
\* ok.
CONSTANTS
    Dialers = {d1, d2}
    SameId = TRUE
    MaxConns = 3
    MaxFaults = 1
    Faults = {"lose"}
    MaxRounds = 1
    MaxStops = 0
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedRoundsStayDown
    RestartIsFresh
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

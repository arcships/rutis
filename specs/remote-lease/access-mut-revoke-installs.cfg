\* Mutation: a connection of a revoked id is installed when its handshake
\* completes instead of being closed with 4003. Expected:
\* violated:RevokedStaysOut.
CONSTANTS
    Dialers = {d1}
    SameId = FALSE
    MaxConns = 2
    Faults = {"revoke"}
    Mutation = "revokeInstalls"
SPECIFICATION Spec
INVARIANTS
    RevokedStaysOut
CHECK_DEADLOCK FALSE

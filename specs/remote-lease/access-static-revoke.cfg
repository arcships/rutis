\* One far end dials a `rutis-host/listen` row; its id is revoked once,
\* after the session took over. The listen row keeps its registration: the
\* installed session unloads and is closed with 4003, the dialer waits as
\* auth-rejected, and its next connection of the same id completes its
\* handshake (rutis' hello included) and is closed with 4003 instead of
\* being installed. Expected: ok, liveness included.
CONSTANTS
    Dialers = {d1}
    SameId = FALSE
    MaxConns = 2
    Faults = {"revoke"}
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedStaysDown
    StaysRegistered
    RevokedStaysOut
PROPERTIES
    EventuallyRevokedWaits
CHECK_DEADLOCK FALSE

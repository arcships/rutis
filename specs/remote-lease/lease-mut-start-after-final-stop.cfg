\* Mutation: a start after the stop of the last round opens another round
\* (the superseded app thread binds again). Expected:
\* violated:FinalStopStaysDown.
CONSTANTS
    Controllers = {c1}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 0
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 2
    MaxStops = 2
    Mutation = "startAfterFinalStop"
SPECIFICATION Spec
INVARIANTS
    FinalStopStaysDown
CHECK_DEADLOCK FALSE

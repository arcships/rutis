\* A listening app started and stopped once per round (four stops, the last
\* final; three starts after a stop): `RutisApp.start` / `stop`
\* interleaved beyond one cycle. A
\* stop may come while a start is still being waited for (pending), and
\* nothing of a stopped round is bound or served in the next. Safety only:
\* with further stops allowed, liveness is checked in `lease-app-restart`
\* after a single stop. Expected: ok.
CONSTANTS
    Controllers = {c1}
    MaxConns = 2
    MaxLoads = 1
    MaxFaults = 1
    LinkStops = FALSE
    Cleanup = "instant"
    Auth = "upgrade"
    MaxRounds = 4
    MaxStops = 4
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneLease
    OldCommandsStayOld
    RuntimeStopped
    RestartIsFresh
    FinalStopStaysDown
CHECK_DEADLOCK FALSE

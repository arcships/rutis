\* A dialing app (RutisApp with `connect`) started and stopped once per
\* round (four stops, the last final; three starts after a stop); a round
\* numbers its dials afresh.
\* Nothing of a stopped round is dialed again, and `ready` belongs to the
\* current round. Safety only (stops make liveness fail). Expected: ok.
CONSTANTS
    Dialers = {d1}
    SameId = FALSE
    MaxConns = 2
    MaxFaults = 0
    Faults = {"stop"}
    MaxRounds = 4
    MaxStops = 4
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OnePluginSetPerId
    StoppedRoundsStayDown
    RestartIsFresh
    FinalStopStaysDown
CHECK_DEADLOCK FALSE

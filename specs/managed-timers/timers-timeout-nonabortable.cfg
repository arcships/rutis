\* One-shot timeout in non-abortable Promise runtime (Node leaf / Bun). Expected: ok.
CONSTANTS
    Kind = "timeout"
    Mode = "nonAbortable"
    Mutation = "none"
    MaxTicks = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterPoolClose
    NoFireAfterUnload
    NoOverlappingTicks
    CleanDetach
CHECK_DEADLOCK FALSE

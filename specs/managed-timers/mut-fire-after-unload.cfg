\* Mutation: timer fires without checking rowState = "active" after unload
\* started (before the unload stack pops timerCleanup).
\* Expected: violated:NoFireAfterUnload.
CONSTANTS
    Kind = "timeout"
    Mode = "nonAbortable"
    Mutation = "fireAfterUnload"
    MaxTicks = 1
SPECIFICATION Spec
INVARIANTS
    NoFireAfterUnload
CHECK_DEADLOCK FALSE

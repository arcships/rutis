\* Periodic fixed-delay interval in abortable runtime (Rust / Python). Expected: ok.
CONSTANTS
    Kind = "interval"
    Mode = "abortable"
    Mutation = "none"
    MaxTicks = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterPoolClose
    NoFireAfterUnload
    NoOverlappingTicks
    CleanDetach
CHECK_DEADLOCK FALSE

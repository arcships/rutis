\* Mutation: fixed-rate interval fires a second tick while tick 1 is still in
\* flight.
\* Expected: violated:NoOverlappingTicks.
CONSTANTS
    Kind = "interval"
    Mode = "nonAbortable"
    Mutation = "overlapTick"
    MaxTicks = 2
SPECIFICATION Spec
INVARIANTS
    NoOverlappingTicks
CHECK_DEADLOCK FALSE

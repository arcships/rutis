\* One-shot timeout in abortable runtime (Rust / Python). Expected: ok.
CONSTANTS
    Kind = "timeout"
    Mode = "abortable"
    Mutation = "none"
    MaxTicks = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterPoolClose
    NoFireAfterUnload
    NoOverlappingTicks
    CleanDetach
CHECK_DEADLOCK FALSE

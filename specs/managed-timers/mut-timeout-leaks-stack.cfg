\* Mutation: a completed one-shot timeout transitions timerState to "done"
\* without detaching its cleanup record from the unload stack (`onStack` stays TRUE).
\* Expected: violated:CleanDetach.
CONSTANTS
    Kind = "timeout"
    Mode = "abortable"
    Mutation = "timeoutLeaksStack"
    MaxTicks = 1
SPECIFICATION Spec
INVARIANTS
    CleanDetach
CHECK_DEADLOCK FALSE

\* Periodic fixed-delay interval in non-abortable Promise runtime (Node leaf / Bun). Expected: ok.
CONSTANTS
    Kind = "interval"
    Mode = "nonAbortable"
    Mutation = "none"
    MaxTicks = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUseAfterPoolClose
    NoFireAfterUnload
    NoOverlappingTicks
    CleanDetach
CHECK_DEADLOCK FALSE

\* Mutation: release the catalog write lock between updating catalogMode,
\* hasCatalog, and warned (allowing a second swap or CheckCatalog to
\* interleave between them).
\* Expected: violated:CatalogFlagInSync.
CONSTANTS
    Mutation = "nonAtomicSwap"
    MaxEpoch = 2
    MaxDispatches = 2
SPECIFICATION Spec
INVARIANTS
    CatalogFlagInSync
CHECK_DEADLOCK FALSE

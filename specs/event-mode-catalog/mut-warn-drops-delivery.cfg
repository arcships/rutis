\* Mutation: under Warn policy, record the warning and drop delivery instead
\* of invoking eligible listeners.
\* Expected: violated:WarnPreservesDelivery.
CONSTANTS
    Mutation = "warnDropsDelivery"
    MaxEpoch = 1
    MaxDispatches = 1
SPECIFICATION Spec
INVARIANTS
    WarnPreservesDelivery
CHECK_DEADLOCK FALSE

\* Exhaustive check of all safety invariants under concurrent catalog swaps
\* (valid and invalid), concurrent dispatchers (emit, serial, bail, unlisted,
\* framework), Warn deduplication epochs, and close admission. Expected: ok.
CONSTANTS
    Mutation = "none"
    MaxEpoch = 2
    MaxDispatches = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoPartialExecOnError
    AtomicCatalogValidation
    WarnPreservesDelivery
    FrameworkNeverBlocked
    CloseDrainPreserved
CHECK_DEADLOCK FALSE

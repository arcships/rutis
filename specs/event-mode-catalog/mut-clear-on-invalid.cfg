\* Mutation: clear the prior valid catalog before validation fails on an
\* invalid catalog entry ("", rutis/*, internal/*).
\* Expected: violated:AtomicCatalogValidation.
CONSTANTS
    Mutation = "clearOnInvalid"
    MaxEpoch = 1
    MaxDispatches = 1
SPECIFICATION Spec
INVARIANTS
    AtomicCatalogValidation
CHECK_DEADLOCK FALSE

\* Before #561: a cancel removes the mark at once. The Rust service that was
\* running the cancelled call keeps going and forwards a call while
\* unmarked, so the chain is no longer a hop.
\* Expected: violated:MarkedWhileRunning.
CONSTANTS
    Runtimes = {r, t}
    Reentrant = {t}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {r, t}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = TRUE
    Cancellers = {r}
    KeepMark = FALSE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    MarkedWhileRunning
CHECK_DEADLOCK TRUE

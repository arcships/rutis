\* #614: the host runs Rust plugin code on one worker thread. A Rust service
\* call that is not on the waiting worker's chain needs a second one; the
\* worker is held by the host's own call, which waits for a runtime call
\* that is buried under the service call. Policy B has no edge for the
\* host's threads, so the cycle is not seen (an explicit non-guarantee).
\* Expected: deadlock.
CONSTANTS
    Runtimes = {p, q, r}
    Reentrant = {p, q}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {p, q, r}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = TRUE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 1
    Services = TRUE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
CHECK_DEADLOCK TRUE

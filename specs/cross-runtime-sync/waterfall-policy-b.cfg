\* A waterfall-sync dispatch: its calls back into the emitter carry the
\* innermost wait chain, so the emitter runs the callback nested.
\* Expected: ok.
CONSTANTS
    Runtimes = {r, t}
    Reentrant = {t}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 1
    Threaded = {}
    Declared = {r, t}
    EmitChain = TRUE
    DispatchMode = "waterfall"
    DispatchHop = FALSE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = FALSE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

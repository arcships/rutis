\* An asynchronous `serial` dispatch inside a Rust service that a runtime
\* called synchronously. The first poll suspends (the filter) and the chain
\* is kept across the suspension (#561), so a listener calling back into
\* the waiting runtime lands on its chain.
\* Expected: ok.
CONSTANTS
    Runtimes = {r, t}
    Reentrant = {t}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 1
    Threaded = {}
    Declared = {r, t}
    EmitChain = TRUE
    DispatchMode = "serial"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 4
    Services = TRUE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

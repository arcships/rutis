    Runtimes = {n, p1, p2}
    Reentrant = {p1, p2}
    Policy = "A"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {n, p1, p2}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
CHECK_DEADLOCK TRUE

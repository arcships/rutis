\* As bail-policy-b, but Rust records the dispatch as a forwarded call: the
\* emitter id is on the listener path.
\* Expected: ok.
CONSTANTS
    Runtimes = {r, t}
    Reentrant = {t}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 1
    Threaded = {}
    Declared = {r, t}
    EmitChain = TRUE
    DispatchMode = "bail"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

\* As policy-b-posts, p non-reentrant (Node): it puts the listener call
\* aside until x returns. Expected: ok.
CONSTANTS
    Runtimes = {n, p, q}
    Reentrant = {q}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 2
    MaxCalls = 1
    MaxPosts = 1
    Threaded = {}
    Declared = {n, p, q}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = FALSE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

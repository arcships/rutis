\* A Cordis node's connectors l1 and l2 share one pump: while l1 waits, l2
\* reads nothing. The host sees two sessions and no wait between them, so
\* the cycle l1 -> x -> l2 is not in its table.
\* Expected: deadlock (an explicit non-guarantee).
CONSTANTS
    Runtimes = {l1, l2, x}
    Reentrant = {x}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {l1, l2, x}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = FALSE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {{l1, l2}}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

\* Before #561: a call made after the asynchronous dispatch's first poll
\* suspended carries no chain. The listener calls the waiting runtime back,
\* which does not recognise the call and puts it aside; policy B sees no
\* cycle.
\* Expected: deadlock.
CONSTANTS
    Runtimes = {r, t}
    Reentrant = {t}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 1
    Threaded = {}
    Declared = {r, t}
    EmitChain = TRUE
    DispatchMode = "serial"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = TRUE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = FALSE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    NoFalseCycle
CHECK_DEADLOCK TRUE

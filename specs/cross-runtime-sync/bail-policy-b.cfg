\* A bail dispatch: the emitter waits, the host calls a listener in t and
\* waits for it, the listener calls back into the waiting emitter. Rust
\* does not record the dispatch itself, and the listener call carries no
\* chain, so the callback is put aside and B does not see it.
\* Expected: deadlock.
CONSTANTS
    Runtimes = {r, t}
    Reentrant = {t}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 1
    Threaded = {}
    Declared = {r, t}
    EmitChain = TRUE
    DispatchMode = "bail"
    DispatchHop = FALSE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = FALSE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

\* A cycle across two hosts. a is on the other host: its synchronous call
\* into b is recorded in the other host's table, not in this one, and the
\* path this host writes carries none of a's ids (`Remote`). Each host sees
\* only its own segment: a waits for b, b calls a back, and a does not
\* recognise the callback.
\* Expected: deadlock (an explicit non-guarantee).
CONSTANTS
    Runtimes = {a, b}
    Reentrant = {b}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {a, b}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = FALSE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {a}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    NoFalseCycle
CHECK_DEADLOCK TRUE

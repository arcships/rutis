\* #561: an emit listener call carries no chain (EmitChain FALSE). One root,
\* one emit, made under the waiting call.
\* Expected: deadlock (the stack-order edges still find the cycle).
CONSTANTS
    Runtimes = {n, p, q}
    Reentrant = {p, q}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 1
    Threaded = {}
    Declared = {n, p, q}
    EmitChain = FALSE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

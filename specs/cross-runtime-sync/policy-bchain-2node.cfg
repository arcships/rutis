\* Policy B without the stack-order rule (chain and put-aside edges only).
\* Expected: deadlock.
CONSTANTS
    Runtimes = {n1, n2, p}
    Reentrant = {p}
    Policy = "Bchain"
    Rebase = TRUE
    MaxRoots = 2
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {n1, n2, p}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = FALSE
    Cancellers = {}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
CHECK_DEADLOCK TRUE

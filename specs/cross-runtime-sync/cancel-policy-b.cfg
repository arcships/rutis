\* The caller cancels a synchronous call into Rust code. The call has
\* already started; its mark stays until it really ends (#561), so a call it
\* forwards is still a hop, and the late reply is dropped.
\* Expected: ok.
CONSTANTS
    Runtimes = {r, t}
    Reentrant = {t}
    Policy = "B"
    Rebase = TRUE
    MaxRoots = 1
    MaxDepth = 3
    MaxCalls = 1
    MaxPosts = 0
    Threaded = {}
    Declared = {r, t}
    EmitChain = TRUE
    DispatchMode = "none"
    DispatchHop = TRUE
    HostRoot = FALSE
    HostHop = TRUE
    Abandoners = {}
    Hidden = {}
    Ends = FALSE
    Async = FALSE
    Workers = 2
    Services = TRUE
    Cancellers = {r}
    KeepMark = TRUE
    KeepChain = TRUE
    Linked = {}
    Remote = {}
SPECIFICATION Spec
INVARIANTS
    RoutingSound
    ChainRecognised
    NoFalseCycle
    MarkedWhileRunning
CHECK_DEADLOCK TRUE

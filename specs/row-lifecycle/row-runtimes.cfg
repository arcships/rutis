\* Two runtimes, two rows each. Runtime "r1" may crash once and is not
\* started again; runtime "r2" must serve its rows all the same: its
\* answer does not wait for "r1" (no runtime waits for another).
\* Expected: ok (safety and RuntimesDoNotWait).
CONSTANTS
    Rows = {"a", "b", "c", "d"}
    MaxConns = 1
    MaxLoads = 1
    Faults = {}
    Failures = FALSE
    SelfEnds = FALSE
    Mutation = "none"
    RowSet2 = {"c", "d"}
    TwoStages = TRUE
    ServiceName = "none"
    ProviderRows = {}
    ConsumerRows = {}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = TRUE
    CrashLimit = 1
    CrashR1 = TRUE
    Restarts = 1
    LoadFaults = FALSE
SPECIFICATION Spec
INVARIANTS
    OneRowPerName
    NoProvisional
    NewSessionOnlyAfterSweep
    NoRowsAfterSweep
    CleanupOnce
PROPERTIES
    RuntimesDoNotWait
CHECK_DEADLOCK FALSE

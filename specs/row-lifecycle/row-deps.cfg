\* Row "a" provides "s", row "b" injects it. Row "a" may fail and restart:
\* while it is unloaded, "s" goes away and "b" must stop; when "a" is back
\* and "s" is provided again, "b" may load again. Expected: ok.
CONSTANTS
    Rows = {"a", "b"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = FALSE
    Mutation = "none"
    RowSet2 = {}
    TwoStages = TRUE
    ServiceName = "s"
    ProviderRows = {"a"}
    ConsumerRows = {"b"}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = FALSE
SPECIFICATION Spec
INVARIANTS
    NoProvisional
    OneRowPerName
    OneProviderPerName
    CleanupOnce
    LoadedNeedsDeps
CHECK_DEADLOCK FALSE

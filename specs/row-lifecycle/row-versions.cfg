\* Two rows both providing "s"; rows may fail and restart. A row's services
\* carry a version: a row may provide its name again (a service update) and
\* the host publishes each announcement in a step of its own. A late, older
\* announcement never overrides a newer one, and a row's names are gone
\* before its unload completes. Expected: ok.
CONSTANTS
    Rows = {"a", "b"}
    MaxConns = 1
    MaxLoads = 1
    Faults = {}
    Failures = TRUE
    SelfEnds = FALSE
    Mutation = "none"
    RowSet2 = {}
    TwoStages = TRUE
    ServiceName = "s"
    ProviderRows = {"a", "b"}
    ConsumerRows = {}
    GateName = "none"
    GateProviders = {}
    GateConsumers = {}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = FALSE
    Versions = TRUE
    MaxProvides = 2
    HostFrames = FALSE
    AsyncHosts = {}
    AsyncRows = {"a"}
    PreciseRefusal = FALSE
    LoadSteps = FALSE
    Refreshes = FALSE
    Updates = FALSE
    MaxUpdates = 1
SPECIFICATION Spec
INVARIANTS
    NoProvisional
    ServicesBeforeRunning
    OneProviderPerName
    CleanupOnce
    NewerWins
    WithdrawBeforeUnload
CHECK_DEADLOCK FALSE

\* Mutation: a refusal is recorded for the row, not the generation it
\* refused: it fails every later restart. Expected: violated:RefusalOnce.
CONSTANTS
    Rows = {"a", "b"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = FALSE
    Mutation = "refusalSticky"
    RowSet2 = {}
    TwoStages = TRUE
    ServiceName = "s"
    ProviderRows = {"a", "b"}
    ConsumerRows = {}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = FALSE
SPECIFICATION Spec
INVARIANTS
    RefusalOnce
CHECK_DEADLOCK FALSE

\* Mutation: the runtime answers the new hello before the old session's
\* rows are cleaned. Expected: violated:NewSessionOnlyAfterSweep.
CONSTANTS
    Rows = {"a"}
    MaxConns = 2
    MaxLoads = 1
    Faults = {"lose"}
    Failures = FALSE
    SelfEnds = FALSE
    Mutation = "acceptBeforeClean"
SPECIFICATION Spec
INVARIANTS
    NewSessionOnlyAfterSweep
CHECK_DEADLOCK FALSE

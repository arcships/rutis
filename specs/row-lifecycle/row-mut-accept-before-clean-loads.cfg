\* Mutation: the runtime answers the new hello before the old session's
\* rows are cleaned, so the new session's row of a name loads while the old
\* session's row of it is still loaded. Expected: violated:OneRowPerName.
CONSTANTS
    Rows = {"a"}
    MaxConns = 2
    MaxLoads = 1
    Faults = {"lose"}
    Failures = FALSE
    SelfEnds = FALSE
    Mutation = "acceptBeforeClean"
SPECIFICATION Spec
INVARIANTS
    OneRowPerName
CHECK_DEADLOCK FALSE

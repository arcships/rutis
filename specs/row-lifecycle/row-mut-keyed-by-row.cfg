\* Mutation: the host ends a row by its name, ignoring the key's
\* generation: an ending of an earlier generation ends the generation that
\* runs now. Expected: violated:OwnFramesOnly.
CONSTANTS
    Rows = {"a"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = TRUE
    Mutation = "keyedByRow"
SPECIFICATION Spec
INVARIANTS
    OwnFramesOnly
CHECK_DEADLOCK FALSE

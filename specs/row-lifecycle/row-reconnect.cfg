    MaxLoads = 1
    Faults = {"lose"}
    Failures = FALSE
    SelfEnds = FALSE
    Mutation = "none"
    RowSet2 = {}
    TwoStages = FALSE
    ServiceName = "none"
    ProviderRows = {}
    ConsumerRows = {}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = FALSE

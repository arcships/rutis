\* Two rows, three connections (two reconnects), the connection may break
\* and the host dials the same id again; no failures, no self-ends.
\* Expected: ok (all safety invariants).
CONSTANTS
    Rows = {"a", "b"}
    MaxConns = 3
    MaxLoads = 1
    Faults = {"lose"}
    Failures = FALSE
    SelfEnds = FALSE
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS
    OneRowPerName
    NewSessionOnlyAfterSweep
    NoRowsAfterSweep
    OwnFramesOnly
    CleanupOnce
CHECK_DEADLOCK FALSE

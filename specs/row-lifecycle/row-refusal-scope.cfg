    Rows = {"a", "b"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = FALSE
    Mutation = "none"
    RowSet2 = {}
    TwoStages = TRUE
    ServiceName = "s"
    ProviderRows = {"a", "b"}
    ConsumerRows = {}
    GateName = "d"
    GateProviders = {"a"}
    GateConsumers = {"b"}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = FALSE
    Versions = FALSE
    MaxProvides = 1
    HostFrames = FALSE
    AsyncHosts = {}
    AsyncRows = {}
    PreciseRefusal = TRUE
    LoadSteps = FALSE
    Refreshes = FALSE
    Updates = FALSE
    MaxUpdates = 1
SPECIFICATION Spec
INVARIANTS
    RefusalScope
    RefusalOnce
    ServicesBeforeRunning
    OneProviderPerName
CHECK_DEADLOCK FALSE

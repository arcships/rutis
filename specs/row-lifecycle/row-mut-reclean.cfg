\* Mutation: an unload of a row that is already gone runs its cleanup
\* again. Expected: violated:CleanupOnce.
CONSTANTS
    Rows = {"a"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = TRUE
    Mutation = "reclean"
SPECIFICATION Spec
INVARIANTS
    CleanupOnce
CHECK_DEADLOCK FALSE

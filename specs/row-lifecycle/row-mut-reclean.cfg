\* Mutation: an unload of a row that is already gone runs its cleanup
\* again. Expected: violated:CleanupOnce.
CONSTANTS
    Rows = {"a"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = TRUE
    Mutation = "reclean"
    RowSet2 = {}
    TwoStages = FALSE
    ServiceName = "none"
    ProviderRows = {}
    ConsumerRows = {}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = FALSE
SPECIFICATION Spec
INVARIANTS
    CleanupOnce
CHECK_DEADLOCK FALSE

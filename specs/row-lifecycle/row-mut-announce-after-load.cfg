    Rows = {"a", "b"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = FALSE
    Mutation = "announceAfterLoad"
    RowSet2 = {}
    TwoStages = TRUE
    ServiceName = "s"
    ProviderRows = {"a", "b"}
    ConsumerRows = {}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = FALSE
SPECIFICATION Spec
INVARIANTS
    ServicesBeforeRunning
CHECK_DEADLOCK FALSE

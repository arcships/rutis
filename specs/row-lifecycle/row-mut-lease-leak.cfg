\* Mutation: an unloaded (or failed) generation keeps its host service
\* lease, so the row is idle while the lease lives on and the next
\* generation loads beside it. Expected: violated:LeaseWithinRow.
CONSTANTS
    Rows = {"a", "b"}
    MaxConns = 1
    MaxLoads = 2
    Faults = {}
    Failures = TRUE
    SelfEnds = FALSE
    Mutation = "leaseLeak"
    RowSet2 = {}
    TwoStages = FALSE
    ServiceName = "none"
    ProviderRows = {}
    ConsumerRows = {}
    HostServiceName = "h"
    LeaseRows = {"a", "b"}
    Crashes = FALSE
    CrashLimit = 0
    CrashR1 = FALSE
    Restarts = 1
    LoadFaults = TRUE
SPECIFICATION Spec
INVARIANTS
    LeaseWithinRow
CHECK_DEADLOCK FALSE

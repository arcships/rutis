\* Two rows on one runtime, which may crash once and be started again; the
\* host may dial it twice. Its old rows are cleaned by the crash (once),
\* the process starts, the host re-resolves the rows' dependencies, and
\* they load again. Expected: ok (safety and liveness).
CONSTANTS
    Rows = {"a", "b"}
    MaxConns = 2
    MaxLoads = 1
    Faults = {}
    Failures = FALSE
    SelfEnds = FALSE
    Mutation = "none"
    RowSet2 = {}
    TwoStages = TRUE
    ServiceName = "none"
    ProviderRows = {}
    ConsumerRows = {}
    HostServiceName = "none"
    LeaseRows = {}
    Crashes = TRUE
    CrashLimit = 1
    CrashR1 = TRUE
    Restarts = 2
    LoadFaults = FALSE
SPECIFICATION Spec
INVARIANTS
    OneRowPerName
    NoProvisional
    CleanupOnce
    NoRowsAfterSweep
PROPERTIES
    RestartRecovers
    EndedLeadsToSwept
CHECK_DEADLOCK FALSE

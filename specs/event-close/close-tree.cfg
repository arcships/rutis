\* Root close: every existing fiber is marked (children before parents),
\* published, then cleaned up; repeated closes reuse the scheduled work.
\* No fiber is created. Safety only. Expected: ok.
CONSTANTS
    Mutation = "none"
    CloseRoots = {"r"}
    SpawnAllowed = FALSE
SPECIFICATION Spec
INVARIANTS
    ClosedDownward
    ClosingImpliesMarked
    CleanupAfterMarkers
    CleanupAfterPublish
    NoCleanupWithFlight
    CleanupOnce
    NoAdmitMarkedOwner
    CommittedStaysOut
    SharedClosedImpliesMarked
CHECK_DEADLOCK FALSE

\* Mutation: the collection misses d. The marker pass on b completes and
\* commits without d, so after the commit a dispatch of d's listener is
\* still admitted. Expected: violated:CommittedStaysOut.
CONSTANTS
    Mutation = "missedMember"
    CloseRoots = {"b"}
    SpawnAllowed = TRUE
SPECIFICATION Spec
INVARIANTS
    CommittedStaysOut
CHECK_DEADLOCK FALSE

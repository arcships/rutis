\* Mutation: publish per-fiber `closing` while the marker pass is still
\* running, so a member is publicly closing before it is marked.
\* Expected: violated:ClosingImpliesMarked.
CONSTANTS
    Mutation = "earlyClosing"
    CloseRoots = {"a"}
    SpawnAllowed = TRUE
SPECIFICATION Spec
INVARIANTS
    ClosingImpliesMarked
CHECK_DEADLOCK FALSE

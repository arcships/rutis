\* One subtree close (b, its children d and n) with every interleaving of
\* selection, the marker pass, publication, cleanup and spawning. Liveness
\* included: every admitted call completes. Expected: ok.
CONSTANTS
    Mutation = "none"
    CloseRoots = {"b"}
    SpawnAllowed = TRUE
SPECIFICATION Spec
INVARIANTS
    ClosedDownward
    ClosingImpliesMarked
    CleanupAfterMarkers
    CleanupAfterPublish
    NoCleanupWithFlight
    CleanupOnce
    NoAdmitMarkedOwner
    CommittedStaysOut
    SharedClosedImpliesMarked
CHECK_DEADLOCK FALSE

\* Mutation: a repeated close queues its members again (no shutdown-task
\* slot check), so cleanup runs twice for one fiber.
\* Expected: violated:CleanupOnce.
CONSTANTS
    Mutation = "reclose"
    CloseRoots = {"b"}
    SpawnAllowed = TRUE
SPECIFICATION Spec
INVARIANTS
    CleanupOnce
CHECK_DEADLOCK FALSE

\* A frame already on the channel when the session closes is read and
\* refused: the session `closed` before the frame is looked at, so the frame
\* settles nothing and takes no reference into a closed session. Both sides
\* may close, so the frames that cross the close are reachable.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = TRUE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "read"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    CancelKeepsSession
    NoUnknownCall
    SettlesAtMostOnce
    LateReplyDropped
    OwnReply
    NoIdReuse
    NoOverRelease
    ClosedClearsTables
    FailUnfinishedOnClose
    GrantsConserved
    LateFramesInert
CHECK_DEADLOCK FALSE

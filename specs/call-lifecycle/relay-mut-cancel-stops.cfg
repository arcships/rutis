\* The relay drops the forwarded request when A's cancel arrives, and sends
\* no cancel on to C. A's cancel stops at the relay; C runs the call and
\* answers nobody. Expected: violated:CancelReaches.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "cancelStopsAtRelay"
    Replies = "always"
SPECIFICATION Spec
INVARIANTS
    CancelReaches
    RelayReleasesImport
    GrantsConserved
CHECK_DEADLOCK FALSE

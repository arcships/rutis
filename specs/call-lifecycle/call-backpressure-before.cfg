\* Before the fix of #626/#1005: a reader thread writes its write-back (the
\* release of a discarded late reply, the throw of a refused call) straight
\* on the channel and blocks in `send` when it is full. Three calls and one
\* cancel are needed: c1 is cancelled after B answered it (A's late reply is
\* the write-back), c2 gives B a second reply that fills B -> A after A read
\* c1's reply, and c3 is refused by B's reader (B's write-back). With one
\* frame per direction, both readers end up blocked, each waiting for the
\* other to read; nothing else is enabled.
\* Expected: deadlock (TLC's deadlock check).
CONSTANTS
    Calls = {"c1", "c2", "c3"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = TRUE
    Cap = 1
    ReaderWrites = "direct"
    Rejects = TRUE
    Replies = "always"
    Sync = {}
    Abandon = "none"
SPECIFICATION Spec

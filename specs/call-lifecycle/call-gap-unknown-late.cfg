\* The caller forgets the cancelled call at once and the callee answers a
\* cancelled running call: the reply is an unknown call and the session ends
\* (SESS-41). The table drains, but a conforming exchange can end a session.
\* Expected: violated:NoUnknownCall.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "forget"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    NoUnknownCall
CHECK_DEADLOCK FALSE

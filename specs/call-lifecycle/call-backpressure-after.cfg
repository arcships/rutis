\* After the fix: the reader hands its write-back to the writer thread's
\* queue instead of writing on the channel, so a full channel makes the
\* writer wait and never the reader; both directions keep being read and
\* every call settles. Same calls, cancel and capacity as
\* `call-backpressure-before`; the deadlock check is on, and `WaitingSettles`
\* must hold.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2", "c3"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = TRUE
    Cap = 1
    ReaderWrites = "queued"
    Rejects = TRUE
    Replies = "always"
    Sync = {}
    Abandon = "none"
SPECIFICATION Spec
INVARIANTS
    CancelKeepsSession
    SettlesAtMostOnce
    LateReplyDropped
    OwnReply
    NoOverRelease
    GrantsConserved
PROPERTIES
    WaitingSettles

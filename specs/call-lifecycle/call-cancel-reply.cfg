\* The reply rule after a cancel, one of the two implementations SESS-61
\* allows: a call cancelled while running is answered as usual, so its reply
\* arrives late, is discarded, and the reference it carries is released.
\* A call still queued is dropped without a reply in either implementation.
\* Expected: ok (every safety invariant and the liveness property).
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
SPECIFICATION Spec
INVARIANTS
    CancelKeepsSession
    SettlesAtMostOnce
    LateReplyDropped
    OwnReply
    NoIdReuse
    NoOverRelease
    GrantsConserved
PROPERTIES
    WaitingSettles

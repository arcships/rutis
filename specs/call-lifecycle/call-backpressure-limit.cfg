\* Before #1005's write-back shape with a host bound on the writer queue:
\* B's reader blocks on a full channel, A's queue fills to the bound and the
\* writer cannot drain it. The session then ends with `the far end is not
\* reading` (SESS-75) instead of both readers waiting forever.
\* Expected: ok (the bound ends the session; `BacklogBounded` holds).
CONSTANTS
    Calls = {"c1", "c2", "c3"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = TRUE
    Cap = 1
    ReaderWrites = "direct"
    Rejects = TRUE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "frames"
    Limit = 2
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    BacklogBounded
    CancelKeepsSession
    SettlesAtMostOnce
    NoOverRelease
    GrantsConserved
CHECK_DEADLOCK FALSE

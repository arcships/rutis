\* The other implementation SESS-61 allows: a call cancelled while running
\* is dropped without an answer when the method finishes. No reply is ever
\* sent for it, so nothing is settled twice and no reference is granted for
\* it; the caller's own cancel settles its call.
\* Expected: ok (every safety invariant and the liveness property).
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "never"
    Sync = {}
    Abandon = "none"
SPECIFICATION Spec
INVARIANTS
    CancelKeepsSession
    SettlesAtMostOnce
    LateReplyDropped
    OwnReply
    NoIdReuse
    NoOverRelease
    GrantsConserved
PROPERTIES
    WaitingSettles

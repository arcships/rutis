\* The queues ignore the host's bound and grow: nothing but the bound would
\* have ended the session, so the backlog is unbounded (SESS-76 without a
\* limit).
\* Expected: violated:BacklogBounded.
CONSTANTS
    Calls = {"c1", "c2", "c3"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "limitIgnored"
    Bound = TRUE
    Cap = 1
    ReaderWrites = "direct"
    Rejects = TRUE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "frames"
    Limit = 2
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    BacklogBounded
CHECK_DEADLOCK FALSE

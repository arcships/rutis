\* A call through the relay, A cancelling it and giving the reference back;
\* both reply rules allowed after a cancel (SESS-61). The cancel reaches C
\* (M passes it on while it still forwards the call), the release reaches C
\* (the relay drops its import), and the grant counts travel the chain
\* without being counted twice.
\* Expected: ok. `CancelledEntriesDrain` is not checked here: the table leaks
\* at both hops (`relay-gap-cancel-table`, #1099).
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "none"
    Replies = "always"
SPECIFICATION Spec
INVARIANTS
    CancelReaches
    RelayReleasesImport
    GrantsConserved
    SettlesAtMostOnce
    LateReplyDropped
CHECK_DEADLOCK FALSE

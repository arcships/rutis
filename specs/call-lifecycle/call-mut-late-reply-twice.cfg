\* Mutation: the reply of a cancelled call is applied as if the call were
\* still waiting, so the call is settled twice (§5.1: once only).
\* Expected: violated:SettlesAtMostOnce.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = TRUE
    Mutation = "lateReplyTwice"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    SettlesAtMostOnce
CHECK_DEADLOCK FALSE

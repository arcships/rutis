\* The same calls with the non-replying callee: a call cancelled while
\* running is dropped at C without a frame, so no late reply travels back
\* and no reply is discarded at either hop.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "none"
    Replies = "never"
SPECIFICATION Spec
INVARIANTS
    CancelReaches
    RelayReleasesImport
    GrantsConserved
    SettlesAtMostOnce
    LateReplyDropped
CHECK_DEADLOCK FALSE

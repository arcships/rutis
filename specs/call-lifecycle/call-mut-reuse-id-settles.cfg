\* The consequence of the same mutation: with the number reused, the reply
\* of one call settles another that waits under the same number.
\* Expected: violated:OwnReply.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = TRUE
    Mutation = "reuseId"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
SPECIFICATION Spec
INVARIANTS
    OwnReply
CHECK_DEADLOCK FALSE

\* The caller's cancelled table, as today (`calls.cancelled`): an entry is
\* cleared only by the late reply it is meant for. A callee that answers a
\* cancelled running call still drops a cancelled queued one without an
\* answer (SESS-57), so that entry is never cleared and the session keeps it
\* until it closes — even with `Replies = "always"` here, and for every
\* conforming callee. This is the #626 gap `BoundedTables` names; both reply
\* implementations are allowed, so the fix is on the caller side (a cancel
\* acknowledgement, or a bound the caller enforces).
\* Expected: violated:CancelledEntriesDrain.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
SPECIFICATION Spec
INVARIANTS
    CancelledEntriesDrain

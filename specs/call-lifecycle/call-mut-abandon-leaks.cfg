\* sync call is absorbed, but its wait-graph edge is not dropped (as if the
\* reader returned the call without `waits::returned`). The session goes on
\* and settles every call, and the edge stays in a quiet session: exactly
\* the uncleanable edge of #626.
\* Expected: violated:AbandonedCallsClean.

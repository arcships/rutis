    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "abandonLeaks"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {"c1"}
    Abandon = "keep"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    AbandonedCallsClean

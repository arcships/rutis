\* No close is possible and one cancel at most: the only way out for a call
\* A waits for is its reply (or the cancel), so the callee must answer what
\* it took. Only the liveness property is checked.
\* Expected: ok. With BReply taken out of Next it fails.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
SPECIFICATION Spec
PROPERTIES
    WaitingSettles
CHECK_DEADLOCK FALSE

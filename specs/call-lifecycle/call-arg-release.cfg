\* A call whose arguments carry a reference of A's. B drops the call while it
\* is still queued (a cancel), the arguments go, and the import they carried
\* writes `release` back on the same session — the same reader write-back as
\* a `throw`. At rest A's table holds none of them.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {"c1"}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    ArgRefsReleased
    ArgRefsCounted
    NoUnknownCall
    SettlesAtMostOnce
    NoOverRelease
    GrantsConserved
PROPERTIES
    WaitingSettles
CHECK_DEADLOCK FALSE

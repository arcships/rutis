\* The same frames, applied despite the close: a reply read after the close
\* settles the call the close already failed a second time (and a `return`
\* keeps its reference in a closed session).
\* Expected: violated:SettlesAtMostOnce.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = TRUE
    Mutation = "lateFrameActs"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "read"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    SettlesAtMostOnce
CHECK_DEADLOCK FALSE

\* The bounded table forgets the oldest entry but the caller keeps SESS-41
\* strict for it: the late reply is an unknown call and ends the session.
\* Expected: violated:NoUnknownCall.
CONSTANTS
    Calls = {"c1", "c2", "c3"}
    MaxCancels = 3
    Closes = FALSE
    Mutation = "forgetStrict"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "bounded"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    NoUnknownCall
CHECK_DEADLOCK FALSE

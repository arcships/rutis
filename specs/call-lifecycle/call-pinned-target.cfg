\* A call that names an object pins it: the caller gets a grant, starts the
\* call, and releases the grant before the method runs. The call still runs
\* and answers, because the export entry the call was admitted from is held
\* by the call, not looked up again. A release of an older grant leaves a
\* newer one in place.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = TRUE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {"c1"}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    PinnedTarget
    SettlesAtMostOnce
    NoOverRelease
    GrantsConserved
    ClosedClearsTables
    NoUnknownCall
CHECK_DEADLOCK FALSE

\* Two calls, one cancel at most, both sides may close, no mutation.
\* Expected: ok (every safety invariant).
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = TRUE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
SPECIFICATION Spec
INVARIANTS
    CancelKeepsSession
    SettlesAtMostOnce
    LateReplyDropped
    OwnReply
    NoIdReuse
    NoOverRelease
    ClosedClearsTables
    FailUnfinishedOnClose
    GrantsConserved
CHECK_DEADLOCK FALSE

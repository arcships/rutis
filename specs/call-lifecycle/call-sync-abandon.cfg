\* A synchronous call given up locally, without a cancel frame (a sync wait
\* has no drop guard, unlike an async future). The caller keeps its waiter
\* and its wait-graph edge until the reply: the callee does not learn the
\* caller stopped waiting, still answers, and A absorbs the reply as a late
\* reply, releasing the reference it carries and dropping the edge. No edge
\* is left behind and the session goes on.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {"c1"}
    Abandon = "keep"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    CancelKeepsSession
    SettlesAtMostOnce
    LateReplyDropped
    OwnReply
    NoOverRelease
    AbandonKeepsSession
    AbandonedCallsClean
    GrantsConserved
PROPERTIES
    WaitingSettles

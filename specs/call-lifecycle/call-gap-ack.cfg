\* The callee acknowledges every cancel (`ack`), so the caller's entry goes
\* when the acknowledgement arrives instead of waiting for a reply. The ack
\* rule comes with "a cancelled call is never answered": with a late reply
\* after the ack the caller would see an unknown call.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "never"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "ack"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    CancelledEntriesDrain
    NoUnknownCall
    SettlesAtMostOnce
    LateReplyDropped
    NoOverRelease
CHECK_DEADLOCK FALSE

\* Any release drops the whole export entry instead of one grant: the second
\* release then names a reference the table no longer has, and the session
\* ends with a release count it never gave.
\* Expected: violated:PinnedTarget.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Closes = FALSE
    Mutation = "releaseDropsAll"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "late"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    PinnedTarget
    NoOverRelease
CHECK_DEADLOCK FALSE

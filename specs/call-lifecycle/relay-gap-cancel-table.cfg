\* The relay's cancelled table, as today: an entry is cleared only by the
\* late reply it is meant for. A forwards a call A cancelled, C still had it
\* queued and drops it without an answer (SESS-57), so M keeps the entry
\* until the session closes — the same gap as the caller's own table, one
\* hop further along (#1099, #626 `BoundedTables`). A's own table keeps its
\* entry too; `call-gap-cancel-table` shows that side.
\* Expected: violated:RelayCancelledEntriesDrain.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "none"
    Replies = "always"
SPECIFICATION Spec
INVARIANTS
    RelayCancelledEntriesDrain
CHECK_DEADLOCK FALSE

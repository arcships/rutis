\* A gives the last grant of the relay back; the relay drops the export entry
\* and the import it held with it. The mutation drops the relay but keeps the
\* import, so C's export stays granted with nobody holding the reference.
\* Expected: violated:RelayReleasesImport.
CONSTANTS
    Calls = {"c1", "c2"}
    MaxCancels = 1
    Mutation = "releaseLeaks"
    Replies = "always"
SPECIFICATION Spec
INVARIANTS
    CancelReaches
    RelayReleasesImport
    GrantsConserved
CHECK_DEADLOCK FALSE

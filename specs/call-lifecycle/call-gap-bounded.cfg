\* The caller keeps a bounded table: at most `TableCap = 1` entries, and the
\* oldest is dropped when the next cancel arrives (the table remembers which
\* calls it dropped; an implementation can use a watermark). Three calls and
\* three cancels show the table staying inside its bound while it would grow
\* if the entry were kept. A reply to a forgotten cancelled call is
\* discarded, not an error — SESS-41 has to tolerate it, which is the price
\* of the bound.
\* Expected: ok.
CONSTANTS
    Calls = {"c1", "c2", "c3"}
    MaxCancels = 3
    Closes = FALSE
    Mutation = "none"
    Bound = FALSE
    Cap = 0
    ReaderWrites = "queued"
    Rejects = FALSE
    Replies = "always"
    Sync = {}
    Abandon = "none"
    Args = {}
    RefCalls = {}
    AfterClose = "lost"
    OutboundLimit = "none"
    Limit = 0
    CancelTable = "bounded"
    TableCap = 1
SPECIFICATION Spec
INVARIANTS
    CancelledTableBounded
    NoUnknownCall
    SettlesAtMostOnce
    LateReplyDropped
    NoOverRelease
CHECK_DEADLOCK FALSE

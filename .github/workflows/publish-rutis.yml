name: publish rutis crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Crate version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rutis-crate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rutis") | .version')
          test "$package_version" = "$RELEASE_VERSION"

      - name: Publish rutis to crates.io
        run: cargo publish --locked -p rutis
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
